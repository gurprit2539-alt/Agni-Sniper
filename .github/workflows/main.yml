name: AGNI Sniper Auto-Run

on:
  schedule:
    # यह मार्केट के टाइम (IST 9:15 AM से 3:30 PM) के हिसाब से सेट है।
    # UTC टाइम में यह सुबह 4:00 से 10:00 बजे तक सोमवार से शुक्रवार चलेगा।
    - cron: '*/5 4-10 * * 1-5'
  workflow_dispatch: # यह आपको मैन्युअली रन करने का बटन भी देगा

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AGNI Code
        env:
          # यह लाइनें आपके सुरक्षित सीक्रेट्स को कोड तक पहुँचाएंगी
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agni.py
