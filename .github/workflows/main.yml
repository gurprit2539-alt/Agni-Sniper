name: AGNI Sniper Live Scan

on:
  schedule:
    # यह मार्केट आवर्स (सुबह 9:15 से दोपहर 3:30 IST) के दौरान हर 5 मिनट में ऑटोमैटिकली चलेगा
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: # मैन्युअल टेस्ट बटन के लिए

jobs:
  run-sniper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AGNI Code
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python agni.py
